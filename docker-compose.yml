services:
  postgres:
    image: postgres:16
    container_name: foodie_wagon_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dla_db
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  next_app:
    build: .
    container_name: next_app
    restart: unless-stopped
    networks:
      - proxy
      - app_network
    expose:
      - "3000"
    depends_on:
      - postgres

networks:
  proxy:
    external: true
  app_network:
    driver: bridge

volumes:
  postgres_data:
